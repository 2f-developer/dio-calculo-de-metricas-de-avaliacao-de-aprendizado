[project]
name = "metricas-classificacao"
version = "1.0.0"
description = "Acurácia, sensibilidade, especificidade, precisão e F-score a partir da matriz de confusão."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.5", "scikit-learn>=1.3"]

[tool.setuptools]
packages = ["metricas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
